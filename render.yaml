# Render Blueprint — debe coincidir con el servicio en dashboard:
# https://dashboard.render.com/web/srv-d9qd1en10e5c739ei6qg
# URL: https://app-entrega-en-tienda.onrender.com

services:
  - type: web
    name: app-entrega-en-tienda
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/setup-version
    autoDeploy: true
    branch: main
    buildFilter:
      paths:
        - app/**
        - build/**
        - prisma/**
        - package.json
        - package-lock.json
        - Dockerfile
        - .dockerignore
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: file:/tmp/entrega-tienda.sqlite
      - key: SCOPES
        value: read_locations,read_orders,read_shipping,write_orders,read_delivery_customizations,write_delivery_customizations,write_discounts
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        value: https://app-entrega-en-tienda.onrender.com
      - key: SETUP_BUILD_ID
        value: 2026-03-09-v15
