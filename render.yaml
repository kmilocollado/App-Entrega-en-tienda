# Render Blueprint — plan Free (sin tarjeta)
# https://render.com/docs/blueprint-spec
#
# Monorepo: en Render, al crear el Blueprint, pon Root Directory = apps/entrega-tienda

services:
  - type: web
    name: entrega-tienda
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: file:/tmp/entrega-tienda.sqlite
      - key: SCOPES
        value: read_locations,read_orders,read_shipping,write_orders,read_delivery_customizations,write_delivery_customizations,write_discounts
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
