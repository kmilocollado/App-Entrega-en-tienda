# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "950341bc65c3b78f044de04fa6d1824e"
name = "entrega-tienda"
application_url = "https://app-entrega-en-tienda.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "https://app-entrega-en-tienda.onrender.com/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "https://app-entrega-en-tienda.onrender.com/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

[access_scopes]
scopes = "read_locations,read_orders,read_shipping,write_orders,read_delivery_customizations,write_delivery_customizations,write_discounts"

[auth]
  redirect_urls = [
  "https://app-entrega-en-tienda.onrender.com/auth/callback",
  "https://app-entrega-en-tienda.onrender.com/auth/shopify/callback",
  "https://app-entrega-en-tienda.onrender.com/api/auth/callback"
]

[shop.metafields.app.entrega_tienda_config]
name = "Entrega en tienda — configuración"
description = "Ciudades, códigos postales, dirección de tienda y precios."
type = "json"
access.storefront = "public_read"
