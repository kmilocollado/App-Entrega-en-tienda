mutation CreateShippingDiscount {
  discountAutomaticAppCreate(
    automaticAppDiscount: {
      title: "Entrega en tienda — Shipping Discount"
      functionHandle: "pickup-discount"
      startsAt: "2026-08-05T00:00:00Z"
      discountClasses: [SHIPPING]
    }
  ) {
    automaticAppDiscount {
      discountId
      title
      status
    }
    userErrors {
      message
    }
  }
}
