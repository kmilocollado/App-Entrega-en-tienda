# fly.toml — https://fly.io/docs/reference/configuration/
# Tras el primer deploy, sustituye SHOPIFY_APP_URL por tu URL real (p. ej. https://entrega-tienda.fly.dev).

app = "entrega-tienda"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  SCOPES = "read_locations,read_orders,read_shipping,write_orders,read_delivery_customizations,write_delivery_customizations,write_discounts"
  SHOPIFY_APP_URL = "https://entrega-tienda.fly.dev"
  SHOPIFY_API_KEY = "950341bc65c3b78f044de04fa6d1824e"
  DATABASE_URL = "file:/data/production.sqlite"

# Sesiones OAuth (SQLite). Crear volumen antes del primer deploy:
#   fly volumes create entrega_tienda_data --region mad --size 1
[mounts]
  source = "entrega_tienda_data"
  destination = "/data"

# Las migraciones Prisma corren en `docker-start` (el volumen SQLite no está en release_command).

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
